<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus TIC - Soluciones Tecnológicas, Software y Hardware</title>
    <!-- Google Fonts y FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --whatsapp: #25d366;
            --dark: #0f172a;
            --light: #f8fafc;
            --gray: #64748b;
            --border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--light);
            color: var(--dark);
            line-height: 1.6;
        }

        /* Top Bar de confianza */
        .top-bar {
            background-color: var(--dark);
            color: #94a3b8;
            font-size: 0.85rem;
            text-align: center;
            padding: 0.6rem 1rem;
        }

        .top-bar span {
            color: #38bdf8;
            font-weight: 600;
        }

        /* Header / Hero Section */
        header {
            background: linear-gradient(rgba(15, 23, 42, 0.88), rgba(30, 41, 59, 0.92)), 
                        url('https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
            color: white;
            padding: 5.5rem 1rem;
            text-align: center;
        }

        header h1 {
            font-size: 2.8rem;
            margin-bottom: 1rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        header p {
            font-size: 1.2rem;
            color: #cbd5e1;
            max-width: 750px;
            margin: 0 auto 2.5rem auto;
        }

        .btn-whatsapp {
            background-color: var(--whatsapp);
            color: white;
            padding: 0.85rem 2.2rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 1.05rem;
            transition: transform 0.2s, background 0.2s;
            box-shadow: 0 4px 14px rgba(37, 211, 102, 0.4);
        }

        .btn-whatsapp:hover {
            transform: translateY(-2px);
            background-color: #20ba5a;
        }

        /* Contenedor General */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 5rem 1.5rem;
        }

        .section-title {
            text-align: center;
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .section-subtitle {
            text-align: center;
            color: var(--gray);
            margin-bottom: 3.5rem;
            font-size: 1.05rem;
        }

        /* Grid de Software / Productos */
        .software-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1.8rem;
        }

        .product-card {
            background: white;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.03);
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 25px -5px rgba(0,0,0,0.08);
        }

        .product-img {
            height: 160px;
            width: 100%;
            object-fit: cover;
        }

        .product-info {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .product-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--dark);
        }

        .product-badge {
            display: inline-block;
            background: #eff6ff;
            color: var(--primary);
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            width: fit-content;
        }

        .product-price {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--dark);
            margin-bottom: 1rem;
        }

        .btn-buy {
            background-color: var(--dark);
            color: white;
            padding: 0.7rem 1rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .btn-buy:hover {
            background-color: var(--whatsapp);
        }

        /* Grid de Servicios Generales */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
        }

        .service-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.03);
            transition: transform 0.3s;
        }

        .service-card:hover {
            transform: translateY(-5px);
        }

        .service-img {
            height: 200px;
            width: 100%;
            object-fit: cover;
        }

        .service-content {
            padding: 2rem;
        }
